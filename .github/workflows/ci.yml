name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run grammar tests
        run: npm test

      - name: Verify the extension packages
        run: npx vsce package --out /tmp/ibmi-languages.vsix
